---
- hosts: all
  become: yes
  tasks:
  # CentOS 7 EOL: mirror.centos.org отключён, переключаем репозитории на vault.centos.org
  - name: switch yum repos to vault.centos.org
    shell: |
      sed -i -e 's/^mirrorlist=/#mirrorlist=/' \
             -e 's|^#\?baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|' \
             /etc/yum.repos.d/CentOS-*.repo
    changed_when: false

  # Установка пакетов bind, bind-utils, vim
  - name: install packages
    yum:
      name:
        - bind
        - bind-utils
        - vim
      state: latest
      update_cache: true

  # Синхронизация времени через chronyd
  - name: start chronyd
    service:
      name: chronyd
      state: restarted
      enabled: true

  # Копирование файла named.zonetransfer.key на хосты
  - name: copy transferkey to all servers and the client
    copy:
      src: named.zonetransfer.key
      dest: /etc/named.zonetransfer.key
      owner: root
      group: named
      mode: 0644

# Настройка хоста ns01
- hosts: ns01
  become: yes
  tasks:
  # Копирование файла named.conf
  - name: copy named.conf
    copy:
      src: master-named.conf
      dest: /etc/named.conf
      owner: root
      group: named
      mode: 0640
      validate: named-checkconf %s

  # Копирование файлов с настройками зоны
  - name: copy zones
    copy:
      src: "{{ item }}"
      dest: /etc/named/
      owner: root
      group: named
      mode: 0660
    with_items:
      - named.ddns.lab
      - named.dns.lab
      - named.dns.lab.client
      - named.dns.lab.rev
      - named.newdns.lab

  # Копирование файла resolv.conf на хосты
  - name: copy resolv.conf to the servers
    template:
      src: servers-resolv.conf.j2
      dest: /etc/resolv.conf
      owner: root
      group: root
      mode: 0644

  # Настройка прав для каталога /etc/named
  - name: set /etc/named permissions
    file:
      path: /etc/named
      owner: root
      group: named
      mode: 0670

  # Перезапуск и добавление в автозагрузку службы named
  - name: ensure named is running and enabled
    service:
      name: named
      state: restarted
      enabled: yes

# Настройка хоста ns02
- hosts: ns02
  become: yes
  tasks:
  - name: copy named.conf
    copy:
      src: slave-named.conf
      dest: /etc/named.conf
      owner: root
      group: named
      mode: 0640
      validate: named-checkconf %s

  - name: copy resolv.conf to the servers
    template:
      src: servers-resolv.conf.j2
      dest: /etc/resolv.conf
      owner: root
      group: root
      mode: 0644

  - name: set /etc/named permissions
    file:
      path: /etc/named
      owner: root
      group: named
      mode: 0670

  - name: ensure named is running and enabled
    service:
      name: named
      state: restarted
      enabled: yes

# Настройка клиентов client и client2
- hosts: client,client2
  become: yes
  tasks:
  - name: copy resolv.conf to the client
    copy:
      src: client-resolv.conf
      dest: /etc/resolv.conf
      owner: root
      group: root
      mode: 0644

  # Копирование конфигурационного файла rndc
  - name: copy rndc conf file
    copy:
      src: rndc.conf
      dest: /home/vagrant/rndc.conf
      owner: vagrant
      group: vagrant
      mode: 0644

  # Настройка сообщения при входе на сервер
  - name: copy motd to the client
    copy:
      src: client-motd
      dest: /etc/motd
      owner: root
      group: root
      mode: 0644
