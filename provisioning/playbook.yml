---
- hosts: all
  become: yes
  tasks:
  # CentOS 7 EOL: mirror.centos.org отключён, используем архивные зеркала
  - name: copy CentOS-Base.repo with vault mirrors
    copy:
      src: CentOS-Base.repo
      dest: /etc/yum.repos.d/CentOS-Base.repo
      owner: root
      group: root
      mode: 0644

  # Установка пакетов bind, bind-utils, vim
  - name: install packages
    yum:
      name:
        - bind
        - bind-utils
        - vim
      state: latest
      update_cache: true
    register: pkgs
    retries: 5
    delay: 15
    until: pkgs is succeeded

  # Синхронизация времени через chronyd
  - name: start chronyd
    service:
      name: chronyd
      state: restarted
      enabled: true

  # Копирование файла named.zonetransfer.key на хосты
  - name: copy transferkey to all servers and the client
    copy:
      src: named.zonetransfer.key
      dest: /etc/named.zonetransfer.key
      owner: root
      group: named
      mode: 0644

# SELinux (задание со *): оставляем Enforcing, разрешаем named писать в /etc/named
- hosts: ns01,ns02
  become: yes
  tasks:
  # Тип named_zone_t для /etc/named (вместо named_conf_t, в который named писать не может)
  - name: set SELinux context named_zone_t for /etc/named
    shell: |
      semanage fcontext -l -C | grep -q '^/etc/named(/.\*)?.*named_zone_t' && exit 0
      semanage fcontext -m -t named_zone_t '/etc/named(/.*)?' 2>/dev/null || \
      semanage fcontext -a -t named_zone_t '/etc/named(/.*)?'
      echo changed
    register: fctx
    changed_when: "'changed' in fctx.stdout"

  - name: restore SELinux context on /etc/named
    command: restorecon -Rv /etc/named
    register: rcon
    changed_when: rcon.stdout != ""

  # Разрешаем named запись в файлы зон (slave-зоны на ns02, журналы ddns на ns01)
  - name: enable SELinux boolean named_write_master_zones
    shell: |
      getsebool named_write_master_zones | grep -q ' on$' && exit 0
      setsebool -P named_write_master_zones on
      echo changed
    register: sebool
    changed_when: "'changed' in sebool.stdout"

# Настройка хоста ns01
- hosts: ns01
  become: yes
  tasks:
  # Копирование файла named.conf
  - name: copy named.conf
    copy:
      src: master-named.conf
      dest: /etc/named.conf
      owner: root
      group: named
      mode: 0640
      validate: named-checkconf %s

  # Копирование файлов с настройками зоны
  - name: copy zones
    copy:
      src: "{{ item }}"
      dest: /etc/named/
      owner: root
      group: named
      mode: 0660
    with_items:
      - named.ddns.lab
      - named.dns.lab
      - named.dns.lab.client
      - named.dns.lab.rev
      - named.newdns.lab

  # Копирование файла resolv.conf на хосты
  - name: copy resolv.conf to the servers
    template:
      src: servers-resolv.conf.j2
      dest: /etc/resolv.conf
      owner: root
      group: root
      mode: 0644

  # Настройка прав для каталога /etc/named
  - name: set /etc/named permissions
    file:
      path: /etc/named
      owner: root
      group: named
      mode: 0670

  # Перезапуск и добавление в автозагрузку службы named
  - name: ensure named is running and enabled
    service:
      name: named
      state: restarted
      enabled: yes

# Настройка хоста ns02
- hosts: ns02
  become: yes
  tasks:
  - name: copy named.conf
    copy:
      src: slave-named.conf
      dest: /etc/named.conf
      owner: root
      group: named
      mode: 0640
      validate: named-checkconf %s

  - name: copy resolv.conf to the servers
    template:
      src: servers-resolv.conf.j2
      dest: /etc/resolv.conf
      owner: root
      group: root
      mode: 0644

  - name: set /etc/named permissions
    file:
      path: /etc/named
      owner: root
      group: named
      mode: 0670

  - name: ensure named is running and enabled
    service:
      name: named
      state: restarted
      enabled: yes

# Настройка клиентов client и client2
- hosts: client,client2
  become: yes
  tasks:
  - name: copy resolv.conf to the client
    copy:
      src: client-resolv.conf
      dest: /etc/resolv.conf
      owner: root
      group: root
      mode: 0644

  # Копирование конфигурационного файла rndc
  - name: copy rndc conf file
    copy:
      src: rndc.conf
      dest: /home/vagrant/rndc.conf
      owner: vagrant
      group: vagrant
      mode: 0644

  # Настройка сообщения при входе на сервер
  - name: copy motd to the client
    copy:
      src: client-motd
      dest: /etc/motd
      owner: root
      group: root
      mode: 0644
